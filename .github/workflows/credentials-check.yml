name: Credentials check

# Proves that every external credential still works, without publishing or
# changing anything: Cloudflare token, Supabase token and database password
# (migration dry run), project region and the public key.
#
# Weekly it checks production only. Staging runs only by hand, because every
# use of the `staging` environment waits for the owner's approval.
# Run it before merging any pull request that depends on new external setup.

on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: Environment to check
        type: choice
        options: [both, production, staging]
        default: both

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Schedule: production only. Manual run: the chosen target (default both).
        environment: ${{ fromJSON(github.event_name == 'schedule' && '["production"]' || (inputs.target == 'both' && '["production","staging"]' || format('["{0}"]', inputs.target))) }}
    environment:
      name: ${{ matrix.environment }}
    env:
      SUPABASE_PROJECT_REF: ${{ matrix.environment == 'staging' && 'jgunfwjjdadgaztlpsjc' || 'tfvnmafqramhmmbhmsvb' }}
      EXPECTED_REGION: sa-east-1
      WORKER_NAME: rollstead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Read-only call that needs a valid token with access to the Worker
      - name: Cloudflare token
        run: npx wrangler deployments list --name "$WORKER_NAME" --json > /dev/null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

      - name: Supabase token and project region
        run: |
          region=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}" | jq -er '.region')
          echo "Region: ${region}"
          [ "${region}" = "${EXPECTED_REGION}" ]
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link the project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Connects with the database password and lists pending migrations; applies nothing
      - name: Database password (migration dry run)
        run: npx supabase db push --linked --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Public key
        run: |
          response=$(curl -sS --fail-with-body \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/health_check?select=status")
          echo "Response: ${response}"
          [ "${response}" = '[{"status":"ok"}]' ]
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ matrix.environment == 'staging' && secrets.SUPABASE_STAGING_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
