name: Preview

# Publishes each pull request to its own Cloudflare Workers Preview URL, backed by
# the staging Supabase project, so changes can be checked by hand before merging.
# Every run waits for the owner's approval (required reviewer on the `staging`
# environment), because the staging tokens could also reach production.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: preview
    # Only branches of this repository: forks and Dependabot never get the staging secrets
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: staging
      url: ${{ steps.preview.outputs.url }}
    # Only one preview at a time: they all share the staging database
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: jgunfwjjdadgaztlpsjc
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Link the staging project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Drops everything in staging and rebuilds it from this branch's migrations and seed.sql
      - name: Reset the staging database
        run: npx supabase db reset --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Build
        run: npm run build

      - name: Publish the Cloudflare preview
        id: preview
        run: |
          output=$(npx wrangler preview --name "$PREVIEW_NAME" --json)
          url=$(printf '%s' "$output" | jq -er '.preview.urls[0]')
          echo "Preview URL: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

      - name: Comment the preview URL on the pull request
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "**Preview:** ${PREVIEW_URL}

          Commit \`${COMMIT_SHA}\`, banco de staging recriado a partir das migrations deste PR."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Smoke test on the preview (Playwright)
        run: npm run test:smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7
