name: Keep-alive

# Free Supabase projects pause after 7 days without "sufficient activity", a
# threshold Supabase does not publish. One read every 3 days was not enough for
# staging (warning e-mail on 2026-11-09), so both projects (production and staging)
# are now pinged every day, on the database and on the login service. Only the
# public (publishable) keys are used, never a service key.
#
# GitHub disables scheduled workflows in public repositories after 60 days without
# repository activity: check this workflow is still enabled every 2 months.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: ping (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        project: [production, staging]
    env:
      SUPABASE_URL: ${{ matrix.project == 'staging' && 'https://jgunfwjjdadgaztlpsjc.supabase.co' || 'https://tfvnmafqramhmmbhmsvb.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ matrix.project == 'staging' && secrets.SUPABASE_STAGING_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Read the health check row
        run: |
          response=$(curl -sS --fail-with-body --retry 3 --retry-delay 20 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/health_check?select=status")
          echo "Response: ${response}"
          [ "${response}" = '[{"status":"ok"}]' ]

      - name: Check the login service
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 20 -o /dev/null \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/auth/v1/health"
          echo "Login service ok"
