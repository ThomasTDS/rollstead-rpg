name: Keep-alive

# Free Supabase projects pause after 7 days without activity. A light read every
# 3 days keeps the database awake between game sessions. Only the public
# (publishable) key is used, never a service key.
#
# GitHub disables scheduled workflows in public repositories after 60 days without
# repository activity: check this workflow is still enabled every 2 months.

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: ping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the health check row
        env:
          SUPABASE_URL: https://fejcdlmlivtztftrxyzu.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          response=$(curl -sS --fail-with-body --retry 3 --retry-delay 20 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/health_check?select=status")
          echo "Response: ${response}"
          [ "${response}" = '[{"status":"ok"}]' ]
